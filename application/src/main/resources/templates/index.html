<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Housing Society Billing Portal</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #222;
        }

        header {
            background: #1f2937;
            color: white;
            padding: 20px 40px;
        }

        header h1 {
            margin: 0;
        }

        .container {
            padding: 40px;
            max-width: 1100px;
            margin: auto;
        }

        .welcome {
            margin-bottom: 30px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .card h2 {
            margin-top: 0;
        }

        .button {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 18px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }

        .button:hover {
            background: #1d4ed8;
        }
    </style>
</head>

<body>

<header>
    <h1>Housing Society Billing Portal</h1>
</header>

<div class="container">

    <div class="welcome">
        <h2>Welcome to the Billing Portal</h2>
        <p>Manage residents and society bills from one place.</p>
    </div>

    <div class="cards">

        <div class="card">
            <h2>Residents</h2>
            <p>View registered society residents.</p>
            <a href="/residents" class="button">View Residents</a>
        </div>

        <div class="card">
            <h2>Bills</h2>
            <p>View generated society bills.</p>
            <a href="/bills" class="button">View Bills</a>
        </div>

        <div class="card">
            <h2>Payment</h2>
            <p>Manage bill payment status.</p>
            <p><strong>API available</strong></p>
        </div>

    </div>

</div>

</body>
</html>
