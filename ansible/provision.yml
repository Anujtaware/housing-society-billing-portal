---
# ===================================================================
# Housing Society Billing Portal - Automated Provisioning & Reliability
# File       : ansible/provision.yml
# Target     : billing_portal (localhost / WSL2 environment)
# Purpose    : Automated environment provisioning, reliability checks,
#              and self-healing container remediation.
# ===================================================================

- name: Automated Provisioning, Reliability Verification & Self-Healing Remediation
  hosts: billing_portal
  gather_facts: true
  become: false

  tasks:
    # ---------------------------------------------------------------
    # 1. Environment Directory Structure Provisioning
    # ---------------------------------------------------------------
    - name: Provision required application filesystem directories
      become: true
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ portal_owner }}"
        group: "{{ portal_group }}"
        mode: "{{ dir_mode }}"
      loop:
        - "{{ portal_base_dir }}"
        - "{{ config_dir }}"
        - "{{ deployments_dir }}"
        - "{{ logs_dir }}"
        - "{{ backups_dir }}"

    # ---------------------------------------------------------------
    # 2. Runtime Environment Prerequisite Verification
    # ---------------------------------------------------------------
    - name: Verify Java 25 runtime binary is present
      ansible.builtin.stat:
        path: "{{ java_binary_path }}"
      register: java_binary_stat
      check_mode: false

    - name: Assert Java runtime binary exists
      ansible.builtin.assert:
        that:
          - java_binary_stat.stat.exists
        fail_msg: "Java runtime binary not found at {{ java_binary_path }}!"
        success_msg: "Java runtime confirmed at {{ java_binary_path }}."

    - name: Inspect Java version
      ansible.builtin.command: "{{ java_binary_path }} -version"
      register: java_version_raw
      changed_when: false
      check_mode: false

    - name: Verify Docker CLI binary is present
      ansible.builtin.stat:
        path: "{{ docker_binary_path }}"
      register: docker_binary_stat
      check_mode: false

    - name: Assert Docker CLI binary exists
      ansible.builtin.assert:
        that:
          - docker_binary_stat.stat.exists
        fail_msg: "Docker binary not found at {{ docker_binary_path }}!"
        success_msg: "Docker binary confirmed at {{ docker_binary_path }}."

    - name: Inspect Docker Engine version
      ansible.builtin.command: "{{ docker_binary_path }} version --format '{{ '{{' }}.Server.Version{{ '}}' }}'"
      register: docker_version_raw
      changed_when: false
      check_mode: false

    # ---------------------------------------------------------------
    # 3. Configuration Management & Template Provisioning
    # ---------------------------------------------------------------
    - name: Provision application environment properties from template
      ansible.builtin.template:
        src: templates/application-env.properties.j2
        dest: "{{ config_dir }}/application-env.properties"
        owner: "{{ portal_owner }}"
        group: "{{ portal_group }}"
        mode: "{{ file_mode }}"

    - name: Provision environment manifest JSON from template
      ansible.builtin.template:
        src: templates/portal-environment.json.j2
        dest: "{{ config_dir }}/portal-environment.json"
        owner: "{{ portal_owner }}"
        group: "{{ portal_group }}"
        mode: "{{ file_mode }}"

    - name: Provision deployment policy file
      ansible.builtin.copy:
        src: files/deployment-policy.txt
        dest: "{{ config_dir }}/deployment-policy.txt"
        owner: "{{ portal_owner }}"
        group: "{{ portal_group }}"
        mode: "{{ file_mode }}"

    # ---------------------------------------------------------------
    # 4. Container Reliability & Automated Self-Healing Remediation
    # ---------------------------------------------------------------
    - name: Inspect Docker CD container status
      ansible.builtin.command: "{{ docker_binary_path }} inspect -f '{{ '{{' }}.State.Running{{ '}}' }}' {{ docker_container_name }}"
      register: container_inspect
      failed_when: false
      changed_when: false
      check_mode: false

    - name: Set container operational facts
      ansible.builtin.set_fact:
        container_exists: "{{ container_inspect.rc == 0 }}"
        container_is_running: "{{ container_inspect.rc == 0 and 'true' in container_inspect.stdout.lower() }}"

    - name: Display detected container status
      ansible.builtin.debug:
        msg: "Container '{{ docker_container_name }}' status: Exists={{ container_exists }}, Running={{ container_is_running }}"

    - name: Execute automated container recovery when container is stopped or missing
      when: not container_is_running
      block:
        - name: Remove stopped/stale container if present
          ansible.builtin.command: "{{ docker_binary_path }} rm -f {{ docker_container_name }}"
          when: container_exists
          changed_when: true

        - name: Launch recovered Docker CD container
          ansible.builtin.command: >-
            {{ docker_binary_path }} run -d
            --name {{ docker_container_name }}
            -p {{ docker_host_port }}:{{ docker_container_port }}
            -e DB_HOST={{ db_host }}
            -e DB_PORT={{ db_port }}
            -e DB_NAME={{ db_name }}
            -e DB_USER={{ db_user }}
            -e DB_PASSWORD={{ db_password }}
            {{ docker_image }}
          changed_when: true
          register: recovery_run_result

        - name: Wait for recovered container application endpoint to become ready
          ansible.builtin.uri:
            url: "{{ docker_cd_url }}"
            status_code: 200
          register: recovery_health_poll
          until: recovery_health_poll.status == 200
          retries: 30
          delay: 2

    # ---------------------------------------------------------------
    # 5. Infrastructure Reliability Checks
    # ---------------------------------------------------------------
    - name: Reliability Check - Verify Docker CD deployment endpoint (Port {{ docker_host_port }})
      ansible.builtin.uri:
        url: "{{ docker_cd_url }}"
        method: GET
        status_code: 200
        return_content: false
      register: cd_endpoint_check
      check_mode: false

    - name: Reliability Check - Verify Docker CD /residents database REST API
      ansible.builtin.uri:
        url: "{{ docker_cd_residents_url }}"
        method: GET
        status_code: 200
        return_content: true
      register: cd_residents_check
      check_mode: false

    - name: Reliability Check - Verify Docker CD /bills database REST API
      ansible.builtin.uri:
        url: "{{ docker_cd_bills_url }}"
        method: GET
        status_code: 200
        return_content: true
      register: cd_bills_check
      check_mode: false

    - name: Reliability Check - Verify Local Spring Boot deployment endpoint (Port 8082)
      ansible.builtin.uri:
        url: "{{ spring_boot_local_url }}"
        method: GET
        status_code: 200
        return_content: false
      register: spring_boot_local_check
      check_mode: false

    - name: Reliability Check - Verify Nginx reverse proxy endpoint (Port 8081)
      ansible.builtin.uri:
        url: "{{ nginx_url }}"
        method: GET
        status_code: 200
        return_content: false
      register: nginx_check
      check_mode: false

    - name: Reliability Check - Verify Jenkins CI server endpoint (Port 8080)
      ansible.builtin.uri:
        url: "{{ jenkins_url }}"
        method: GET
        status_code: 200
        return_content: false
      register: jenkins_check
      check_mode: false

    # ---------------------------------------------------------------
    # 6. Reliability & Provisioning Audit Summary
    # ---------------------------------------------------------------
    - name: Display Comprehensive Reliability Audit Summary
      ansible.builtin.debug:
        msg:
          - "=========================================================="
          - " Housing Society Billing Portal - Reliability Audit Report"
          - "=========================================================="
          - "Application Status   : HEALTHY & PROVISIONED"
          - "Container Status     : {{ docker_container_name }} (RUNNING)"
          - "Docker CD Port 8084  : HTTP 200 OK (Verified)"
          - "REST API /residents  : HTTP 200 OK (Records Verified)"
          - "REST API /bills      : HTTP 200 OK (Records Verified)"
          - "Spring Boot Port 8082: HTTP 200 OK (Verified)"
          - "Nginx Port 8081      : HTTP 200 OK (Verified)"
          - "Jenkins Port 8080    : HTTP 200 OK (Verified)"
          - "Java Runtime         : {{ java_version_raw.stderr_lines[0] | default('Verified') }}"
          - "Docker Engine        : {{ docker_version_raw.stdout | default('Verified') }}"
          - "Config Directory     : {{ config_dir }} (Provisioned)"
          - "Self-Healing Mode    : ACTIVE (Automatic Container Recovery)"
          - "=========================================================="
